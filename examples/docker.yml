collect:
  # Read the Docker Compose file
  compose-file:
    file:read:
      path: docker-compose.yml

  # Extract services section for processing
  compose-services:
    yaml:key:
      input: compose-file
      path: services
      nodes-only: true

  # Extract service metadata - grouped for clarity
  service-images:
    yaml:key:
      input: compose-services
      path: image

  service-lagoon-types:
    yaml:key:
      input: compose-services
      path: labels['lagoon.type']

  dockerfile-paths:
    yaml:key:
      input: compose-services
      path: build.dockerfile

  build-args:
    yaml:key:
      input: compose-services
      path: build.args
      resolve-env: true

  # Process Dockerfiles to extract base images
  dockerfiles:
    file:read:multiple:
      input: dockerfile-paths

  dockerfile-base-images:
    docker:images:
      input: dockerfiles
      additional-inputs: [build-args]
      no-tag: true
      args-from: build-args
      ignore: [$CLI_IMAGE]

# Centralized policy definitions (reduces repetition)
policies:
  image-policy: &image-policy
    allowed:
      - govcms/govcms
      - govcms/php
      - govcms/test
      - govcms/nginx-drupal
      - govcms/redis
      - govcms/solr
      - govcms/varnish-drupal
      - govcms/mariadb-drupal
      - govcms/av
      - uselagoon/php-8.1-cli-drupal
      - uselagoon/nginx-drupal
      - uselagoon/php-8.1-fpm
      - uselagoon/solr-7.7-drupal
      - uselagoon/varnish-drupal
      - uselagoon/redis-5
      - uselagoon/mariadb-drupal
    deprecated:
      - govcms8lagoon/govcms
      - govcms8lagoon/php
      - govcms8lagoon/test
      - govcms8lagoon/nginx-drupal
      - govcms8lagoon/redis
      - govcms8lagoon/solr
      - govcms8lagoon/varnish-drupal
      - govcms8lagoon/mariadb-drupal
      - uselagoon/php-7.4-cli-drupal
      - uselagoon/php-7.4-fpm

  lagoon-service-policy: &lagoon-policy
    allowed:
      - none
      - cli
      - cli-persistent
      - mariadb
      - mariadb-dbaas
      - nginx
      - nginx-php
      - nginx-php-persistent
      - redis
      - redis-persistent
      - solr
      - varnish
      - varnish-persistent

analyse:
  # Docker Compose service image validation
  compose-service-images:
    allowed:list:
      description: Validate Docker Compose service images against approved list
      input: service-images
      package-match: '^([^:@]*)?[:@]?([^ latest$]*)'
      <<: *image-policy
      exclude-keys: [cli, mariadb, chrome]
      severity: high

  # Lagoon service type validation
  lagoon-service-types:
    allowed:list:
      description: Validate Lagoon service types are supported
      input: service-lagoon-types
      <<: *lagoon-policy
      severity: medium

  # Dockerfile base image validation
  dockerfile-base-images-check:
    allowed:list:
      description: Validate base images in Dockerfiles against approved list
      input: dockerfile-base-images
      package-match: '^([^:@]*)?[:@]?([^ latest$]*)'
      <<: *image-policy
      exclude-keys: [test]
      severity: high

# Output configuration
output:
  stdout:
    format: pretty

  # Lagoon integration (requires LAGOON_API_TOKEN environment variable)
  lagoon:
    source: shipshape:paas:docker
    api-base-url: https://api.lagoon.amazeeio.cloud
    api-token: ${LAGOON_API_TOKEN}

# Configuration notes and remediation guidance
#
# Common fixes for violations:
#
# 1. Deprecated images - upgrade to supported versions:
#    - govcms8lagoon/* → govcms/*
#    - uselagoon/php-7.4-* → uselagoon/php-8.1-*
#
# 2. Unsupported service types - use approved Lagoon service types:
#    - Use 'nginx-php' instead of custom service types
#    - Ensure service types match your deployment environment
#
# 3. Disallowed base images in Dockerfiles:
#    - Use only approved base images from the allowed list
#    - Check build args are properly resolved
