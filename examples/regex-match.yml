# Requires a `core.extension.yml` in the working directory. A sample is
# bundled at examples/testdata/core.extension.yml, e.g. run with:
#   cd examples/testdata && shipshape run . -f ../regex-match.yml
collect:
  extension-file:
    file:read:
      path: core.extension.yml

  module-lagoon_logs:
    yaml:key:
      input: extension-file
      path: module.lagoon_logs

analyse:
  lagoon-logs-check:
    regex:match:
      description: Lagoon logs module is not enabled
      input: module-lagoon_logs
      pattern: "^0$"

output:
  stdout:
    format: table
  file:
    path: results.xml
    format: junit