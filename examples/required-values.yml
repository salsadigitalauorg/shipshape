# Requires a `core.extension.yml` in the working directory. A sample is
# bundled at examples/testdata/core.extension.yml, e.g. run with:
#   cd examples/testdata && shipshape run . -f ../required-values.yml
collect:
  extension-file:
    file:read:
      path: core.extension.yml

  modules:
    yaml:key:
      input: extension-file
      path: module
      keys-only: true

analyse:
  lagoon-logs-check:
    allowed:list:
      description: Lagoon logs module is not enabled
      input: modules
      required:
        - lagoon_logs
