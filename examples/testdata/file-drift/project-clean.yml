name: my-actual-project
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: notify
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -H "Authorization: Bearer $TOKEN" https://example.com
