name: Go

on:
  push:
    branches: [ 1.x ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ 1.x ]
    paths-ignore:
      - 'docs/**'

jobs:

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"

    - name: Run generators
      run: go generate ./...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -ldflags="-s -w" -o build/shipshape . && ls -lh build/shipshape

    - name: List check types
      run: ./build/shipshape config list-checks

    - name: List plugins
      run: ./build/shipshape config list-plugins

    - name: Test
      # Exclude the e2e suite (tests/e2e) and generators from unit-test runs;
      # the e2e suite has its own Docker-capable workflow (.github/workflows/e2e.yml).
      run: go test -v -race $(go list ./... | grep -v /cmd/gen | grep -v /tests/e2e) -coverprofile=build/coverage.out

    - uses: shogo82148/actions-goveralls@4b30166c2ac96ac557328a27874a16b777f9b8bd # v1
      with:
        path-to-profile: build/coverage.out

    - name: Upload test coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build
        path: build
      if: github.ref_name == '1.x'

  publish-binary:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27"

    - name: Fetch all tags
      run: git fetch --force --tags
      if: startsWith(github.ref_name, 'v')

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        # Pinned deliberately: 'latest' lets the toolchain change with no
        # commit here, and a v3 would drop the deprecated keys this config
        # still uses. Bump after running `goreleaser check` against the new
        # version. [ES8-application-control]
        version: '~> v2.19'
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      if: startsWith(github.ref_name, 'v')

  publish-docker:
    needs:
      - test-build
      - publish-binary
    uses: ./.github/workflows/docker-publish.yml
