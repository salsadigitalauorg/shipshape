name: Go

on:
  push:
    branches: [ 1.x ]
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ 1.x ]
    paths-ignore:
      - 'docs/**'

jobs:

  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Run generators
      run: go generate ./...

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -ldflags="-s -w" -o build/shipshape . && ls -lh build/shipshape

    - name: List check types
      run: ./build/shipshape config list-checks

    - name: List plugins
      run: ./build/shipshape config list-plugins

    - name: Test
      # Exclude the e2e suite (tests/e2e) and generators from unit-test runs;
      # the e2e suite has its own Docker-capable workflow (.github/workflows/e2e.yml).
      run: go test -v -race $(go list ./... | grep -v /cmd/gen | grep -v /tests/e2e) -coverprofile=build/coverage.out

    - uses: shogo82148/actions-goveralls@9606dbc5ac5cf888a0e9ef901515c3cd516a2790 # v1
      with:
        path-to-profile: build/coverage.out

    - name: Upload test coverage
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build
        path: build
      if: github.ref_name == '1.x'

  publish-binary:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: 1.25

    - name: Fetch all tags
      run: git fetch --force --tags
      if: startsWith(github.ref_name, 'v')

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: latest
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      if: startsWith(github.ref_name, 'v')

  publish-docker:
    needs:
      - test-build
      - publish-binary
    uses: ./.github/workflows/docker-publish.yml
