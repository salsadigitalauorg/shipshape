name: Publish docs

on:
  push:
    branches: [ 1.x ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build the docs
        run: |
          cd docs
          npm install
          npm run build

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/src/.vuepress/dist/1.x
          git init --initial-branch=gh-pages
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -m "Auto deploy from GitHub Actions"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

  quantcdn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build the docs
        run: |
          cd docs
          npm install
          npm run build

      - name: Publish to Quant
        uses: quantcdn/deploy-action@v7.0.1
        with:
          customer: salsa-digital
          project: shipshape
          token: ${{ secrets.QUANT_TOKEN }}
          dir: docs/src/.vuepress/dist
          skip-unpublish-regex: '^/main.*'
