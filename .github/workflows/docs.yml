name: Publish docs

on:
  push:
    branches: [ 1.x ]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: vuepress-deploy
        uses: jenkey2011/vuepress-deploy@master
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SCRIPT: cd docs && npm install && npm run build
          BUILD_DIR: src/.vuepress/dist/1.x

  quantcdn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build the docs
        run: |
          cd docs
          npm install
          npm run build

      - name: Publish to Quant
        uses: quantcdn/deploy-action@v6.1.0
        with:
          customer: salsa-digital
          project: shipshape
          token: ${{ secrets.QUANT_TOKEN }}
          dir: docs/src/.vuepress/dist
          skip-unpublish-regex: '^/main.*'
